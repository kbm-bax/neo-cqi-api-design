openapi: 3.0.3

info:
  title: CQI Syringe Usage API
  version: 1.0.0
  description: |
    CQI Syringe Usage API for Neo CQI.

    This API provides syringe-usage summaries, breakdowns, trends,
    syringe-size distribution, infusion-level drill-down, infusion-story
    references, and export support for Novum IQ syringe-pump infusions.

    The API is storage-agnostic. It does not expose SQL, lakehouse zones,
    table names, partitions, or physical schema details.

servers:
  - url: /api/cqi/v1
    description: CQI API v1

security:
  - bearerAuth: []

tags:
  - name: Syringe Usage Summary
    description: Aggregate syringe-usage KPIs for a selected infusion population.
  - name: Syringe Usage Breakdown
    description: Syringe-usage metrics grouped by CQI business dimensions.
  - name: Syringe Usage Trends
    description: Syringe-usage metrics over time.
  - name: Syringe Size Distribution
    description: Infusion and volume distribution across syringe sizes and brands.
  - name: Syringe Usage Infusions
    description: Infusion-level syringe usage query, details, and story references.
  - name: Syringe Usage Exports
    description: Export syringe-usage data.

paths:

  /syringe-usage/summary-query:
    post:
      tags:
        - Syringe Usage Summary
      operationId: getSyringeUsageSummary
      summary: Get syringe usage summary
      description: |
        Returns aggregate syringe-usage metrics for a selected infusion
        population. Used by CQI dashboards, KPI widgets, and report headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageSummaryRequest"
            examples:
              default:
                summary: Syringe usage summary request
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    drugLibraryVersionIds:
                      - "DLV-1002"
                    careAreaIds:
                      - "CA-NICU"
                    pumpTypes:
                      - "SYR"
                    syringeSizesMl:
                      - 10
                      - 20
                      - 50
      responses:
        "200":
          description: Syringe usage summary returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageSummaryResponse"
              examples:
                success:
                  value:
                    summary:
                      totalSyringeInfusions: 4820
                      uniqueDeviceCount: 86
                      uniqueSyringeSizeCount: 5
                      totalVolumeInfusedMl: 18640.5
                      averageSyringeUtilizationPercent: 62.4
                      syringeChangeCount: 318
                      emptySyringeEventCount: 94
                      nearEmptyEventCount: 210
                      infusionsWithSyringeChangeCount: 275
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/breakdown-query:
    post:
      tags:
        - Syringe Usage Breakdown
      operationId: getSyringeUsageBreakdown
      summary: Get syringe usage breakdown
      description: |
        Returns syringe-usage metrics grouped by a selected CQI business
        dimension such as syringe size, syringe brand, care area, or drug.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageBreakdownRequest"
            examples:
              bySyringeSize:
                summary: Syringe usage breakdown by syringe size
                value:
                  groupBy: "SYRINGE_SIZE"
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    drugLibraryVersionIds:
                      - "DLV-1002"
      responses:
        "200":
          description: Syringe usage breakdown returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageBreakdownResponse"
              examples:
                success:
                  value:
                    groupBy: "SYRINGE_SIZE"
                    items:
                      - id: "SIZE-10"
                        name: "10 mL"
                        totalSyringeInfusions: 1800
                        totalVolumeInfusedMl: 9200.0
                        averageSyringeUtilizationPercent: 71.2
                        syringeChangeCount: 40
                        emptySyringeEventCount: 18
                      - id: "SIZE-50"
                        name: "50 mL"
                        totalSyringeInfusions: 950
                        totalVolumeInfusedMl: 6100.4
                        averageSyringeUtilizationPercent: 48.6
                        syringeChangeCount: 120
                        emptySyringeEventCount: 31
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/trends-query:
    post:
      tags:
        - Syringe Usage Trends
      operationId: getSyringeUsageTrends
      summary: Get syringe usage trend
      description: Returns syringe-usage metrics over time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageTrendRequest"
            examples:
              daily:
                value:
                  granularity: "DAILY"
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    pumpTypes:
                      - "SYR"
      responses:
        "200":
          description: Syringe usage trend returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageTrendResponse"
              examples:
                success:
                  value:
                    granularity: "DAILY"
                    points:
                      - periodStart: "2026-01-01T00:00:00Z"
                        periodEnd: "2026-01-01T23:59:59Z"
                        totalSyringeInfusions: 160
                        totalVolumeInfusedMl: 620.5
                        syringeChangeCount: 12
                        emptySyringeEventCount: 3
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/size-distribution-query:
    post:
      tags:
        - Syringe Size Distribution
      operationId: getSyringeSizeDistribution
      summary: Get syringe size distribution
      description: |
        Returns infusion count and volume distribution across syringe sizes
        and optional brands. Used by CQI size-mix charts and drug-library
        syringe configuration reviews.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeSizeDistributionRequest"
            examples:
              default:
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    careAreaIds:
                      - "CA-NICU"
                  includeBrandSplit: true
      responses:
        "200":
          description: Syringe size distribution returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeSizeDistributionResponse"
              examples:
                success:
                  value:
                    buckets:
                      - syringeSizeMl: 10
                        syringeBrand: "BD"
                        infusionCount: 820
                        totalVolumeInfusedMl: 4100.0
                        averageUtilizationPercent: 74.1
                      - syringeSizeMl: 10
                        syringeBrand: "Terumo"
                        infusionCount: 310
                        totalVolumeInfusedMl: 1480.2
                        averageUtilizationPercent: 69.8
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/infusions-query:
    post:
      tags:
        - Syringe Usage Infusions
      operationId: searchSyringeUsageInfusions
      summary: Search syringe usage infusions
      description: Returns syringe-pump infusions for grid, drill-down, and export preparation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageInfusionQueryRequest"
            examples:
              withChanges:
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    syringeSizesMl:
                      - 50
                    hasSyringeChange: true
                  page:
                    pageNumber: 1
                    pageSize: 50
                  sort:
                    field: "startedAt"
                    direction: "DESC"
      responses:
        "200":
          description: Matching syringe usage infusions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageInfusionListResponse"
              examples:
                success:
                  value:
                    items:
                      - syringeUsageInfusionId: "SUI-10001"
                        infusionId: "INF-123"
                        deviceSerialNumber: "SN-SYR-001"
                        pumpType: "SYR"
                        careAreaName: "NICU"
                        drugName: "Morphine"
                        syringeSizeMl: 50
                        syringeBrand: "BD"
                        volumeInfusedMl: 28.4
                        syringeUtilizationPercent: 56.8
                        syringeChangeCount: 1
                        startedAt: "2026-01-02T10:35:00Z"
                    page:
                      pageNumber: 1
                      pageSize: 50
                      totalItems: 275
                      hasMore: true
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/infusions/{infusionId}:
    get:
      tags:
        - Syringe Usage Infusions
      operationId: getSyringeUsageInfusion
      summary: Get syringe usage infusion detail
      parameters:
        - $ref: "#/components/parameters/InfusionId"
      responses:
        "200":
          description: Syringe usage infusion detail returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageInfusionDetailResponse"
              examples:
                success:
                  value:
                    infusion:
                      syringeUsageInfusionId: "SUI-10001"
                      infusionId: "INF-123"
                      deviceId: "DEV-200"
                      deviceSerialNumber: "SN-SYR-001"
                      pumpType: "SYR"
                      careAreaId: "CA-NICU"
                      careAreaName: "NICU"
                      drugId: "DRUG-MORPHINE"
                      drugName: "Morphine"
                      syringeSizeMl: 50
                      syringeBrand: "BD"
                      syringeModel: "Luer-Lok"
                      programmedVolumeMl: 30.0
                      volumeInfusedMl: 28.4
                      remainingVolumeMl: 1.6
                      syringeUtilizationPercent: 56.8
                      syringeChangeCount: 1
                      emptySyringeEventCount: 0
                      nearEmptyEventCount: 1
                      startedAt: "2026-01-02T10:35:00Z"
                      endedAt: "2026-01-02T14:10:00Z"
                      canShowInfusionStory: true
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/infusions/{infusionId}/infusion-story-reference:
    get:
      tags:
        - Syringe Usage Infusions
      operationId: getSyringeUsageInfusionStoryReference
      summary: Get infusion story reference for a syringe usage infusion
      parameters:
        - $ref: "#/components/parameters/InfusionId"
      responses:
        "200":
          description: Infusion story reference returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfusionStoryReferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/exports:
    post:
      tags:
        - Syringe Usage Exports
      operationId: createSyringeUsageExport
      summary: Create syringe usage export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageExportRequest"
            examples:
              csv:
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                  exportFormat: "CSV"
                  columns:
                    - "infusionId"
                    - "deviceSerialNumber"
                    - "careAreaName"
                    - "drugName"
                    - "syringeSizeMl"
                    - "syringeBrand"
                    - "volumeInfusedMl"
                    - "syringeUtilizationPercent"
                    - "startedAt"
      responses:
        "202":
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageExportAcceptedResponse"
              examples:
                accepted:
                  value:
                    exportId: "EXP-SYR-1001"
                    status: "ACCEPTED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/exports/{exportId}:
    get:
      tags:
        - Syringe Usage Exports
      operationId: getSyringeUsageExportStatus
      summary: Get syringe usage export status
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export status returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageExportStatusResponse"
              examples:
                completed:
                  value:
                    exportId: "EXP-SYR-1001"
                    status: "COMPLETED"
                    fileName: "syringe-usage-export-202601.csv"
                    downloadUrl: "https://exports.cqi.example.com/EXP-SYR-1001.csv?sig=..."
                    expiresAt: "2026-07-08T11:31:20Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InfusionId:
      name: infusionId
      in: path
      required: true
      schema:
        type: string
      example: "INF-123"

    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
      example: "EXP-SYR-1001"

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Caller does not have access to the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    SyringeUsageSummaryRequest:
      type: object
      required:
        - filters
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeUsageBreakdownRequest:
      type: object
      required:
        - groupBy
        - filters
      properties:
        groupBy:
          $ref: "#/components/schemas/SyringeUsageGroupBy"
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeUsageTrendRequest:
      type: object
      required:
        - granularity
        - filters
      properties:
        granularity:
          $ref: "#/components/schemas/TrendGranularity"
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeSizeDistributionRequest:
      type: object
      required:
        - filters
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"
        includeBrandSplit:
          type: boolean
          default: false
          description: When true, distribution buckets are split by syringe brand.

    SyringeUsageInfusionQueryRequest:
      type: object
      required:
        - filters
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"
        page:
          $ref: "#/components/schemas/PageRequest"
        sort:
          $ref: "#/components/schemas/SortRequest"

    SyringeUsageExportRequest:
      type: object
      required:
        - filters
        - exportFormat
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        columns:
          type: array
          items:
            type: string
          example:
            - "infusionId"
            - "deviceSerialNumber"
            - "careAreaName"
            - "drugName"
            - "syringeSizeMl"
            - "syringeBrand"
            - "volumeInfusedMl"
            - "syringeUtilizationPercent"
            - "startedAt"

    SyringeUsageFilter:
      type: object
      properties:
        dateRange:
          $ref: "#/components/schemas/DateRange"

        drugLibraryVersionIds:
          type: array
          items:
            type: string
          example:
            - "DLV-1002"

        careAreaIds:
          type: array
          items:
            type: string
          example:
            - "CA-NICU"

        drugIds:
          type: array
          items:
            type: string
          example:
            - "DRUG-MORPHINE"

        deviceIds:
          type: array
          items:
            type: string
          example:
            - "DEV-200"

        deviceSerialNumbers:
          type: array
          items:
            type: string
          example:
            - "SN-SYR-001"

        pumpTypes:
          type: array
          items:
            type: string
          example:
            - "SYR"

        enterpriseHierarchyNodeIds:
          type: array
          items:
            type: string
          example:
            - "EH-100"

        syringeSizesMl:
          type: array
          items:
            type: number
            format: double
          example:
            - 10
            - 20
            - 50

        syringeBrands:
          type: array
          items:
            type: string
          example:
            - "BD"
            - "Terumo"

        hasSyringeChange:
          type: boolean
          description: When true, only infusions with at least one syringe change.

        hasEmptySyringeEvent:
          type: boolean

    DateRange:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        to:
          type: string
          format: date-time
          example: "2026-01-31T23:59:59Z"

    SyringeUsageSummaryResponse:
      type: object
      required:
        - summary
        - dataFreshness
      properties:
        summary:
          $ref: "#/components/schemas/SyringeUsageSummary"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageBreakdownResponse:
      type: object
      required:
        - groupBy
        - items
        - dataFreshness
      properties:
        groupBy:
          $ref: "#/components/schemas/SyringeUsageGroupBy"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageBreakdownItem"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageTrendResponse:
      type: object
      required:
        - granularity
        - points
        - dataFreshness
      properties:
        granularity:
          $ref: "#/components/schemas/TrendGranularity"
        points:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageTrendPoint"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeSizeDistributionResponse:
      type: object
      required:
        - buckets
        - dataFreshness
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/SyringeSizeDistributionBucket"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageInfusionListResponse:
      type: object
      required:
        - items
        - page
        - dataFreshness
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageInfusion"
        page:
          $ref: "#/components/schemas/PageMetadata"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageInfusionDetailResponse:
      type: object
      required:
        - infusion
        - dataFreshness
      properties:
        infusion:
          $ref: "#/components/schemas/SyringeUsageInfusionDetail"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    InfusionStoryReferenceResponse:
      type: object
      required:
        - infusionId
        - canShowInfusionStory
      properties:
        infusionId:
          type: string
          example: "INF-123"
        canShowInfusionStory:
          type: boolean
          example: true
        reason:
          type: string
          nullable: true
          example: "Infusion story is available for this syringe infusion."
        storyReference:
          type: object
          nullable: true
          properties:
            infusionId:
              type: string
              example: "INF-123"
            href:
              type: string
              example: "/api/cqi/v1/infusion-stories/INF-123"

    SyringeUsageExportAcceptedResponse:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
          example: "EXP-SYR-1001"
        status:
          $ref: "#/components/schemas/ExportStatus"

    SyringeUsageExportStatusResponse:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
          example: "EXP-SYR-1001"
        status:
          $ref: "#/components/schemas/ExportStatus"
        fileName:
          type: string
          nullable: true
          example: "syringe-usage-export-202601.csv"
        downloadUrl:
          type: string
          nullable: true
          description: Secure temporary download URL, if export is ready.
        expiresAt:
          type: string
          format: date-time
          nullable: true

    SyringeUsageSummary:
      type: object
      required:
        - totalSyringeInfusions
      properties:
        totalSyringeInfusions:
          type: integer
          minimum: 0
          example: 4820
        uniqueDeviceCount:
          type: integer
          minimum: 0
          example: 86
        uniqueSyringeSizeCount:
          type: integer
          minimum: 0
          example: 5
        totalVolumeInfusedMl:
          type: number
          format: double
          minimum: 0
          example: 18640.5
        averageSyringeUtilizationPercent:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          example: 62.4
        syringeChangeCount:
          type: integer
          minimum: 0
          example: 318
        emptySyringeEventCount:
          type: integer
          minimum: 0
          example: 94
        nearEmptyEventCount:
          type: integer
          minimum: 0
          example: 210
        infusionsWithSyringeChangeCount:
          type: integer
          minimum: 0
          example: 275

    SyringeUsageBreakdownItem:
      type: object
      required:
        - id
        - name
        - totalSyringeInfusions
      properties:
        id:
          type: string
          example: "SIZE-10"
        name:
          type: string
          example: "10 mL"
        totalSyringeInfusions:
          type: integer
          minimum: 0
          example: 1800
        totalVolumeInfusedMl:
          type: number
          format: double
          minimum: 0
          example: 9200.0
        averageSyringeUtilizationPercent:
          type: number
          format: double
          nullable: true
          example: 71.2
        syringeChangeCount:
          type: integer
          minimum: 0
          example: 40
        emptySyringeEventCount:
          type: integer
          minimum: 0
          example: 18
        uniqueDeviceCount:
          type: integer
          minimum: 0
          example: 22

    SyringeUsageTrendPoint:
      type: object
      required:
        - periodStart
        - periodEnd
        - totalSyringeInfusions
      properties:
        periodStart:
          type: string
          format: date-time
