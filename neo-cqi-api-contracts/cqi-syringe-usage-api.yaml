openapi: 3.0.3

info:
  title: CQI Syringe Usage API
  version: 1.0.0
  description: |
    CQI Syringe Usage API for Neo CQI.

    This API is the Infusions Reporting Context contract for Syringe Usage
    Reporting, as named in the current CQI capabilities and bounded-context
    notes.

    It uses only the shared CQI reporting envelope already defined by the
    sibling infusion reports in this repository (filters, grouping, paging,
    export, and data freshness). It does not define syringe-specific measures
    or dimensions. Those fields are omitted until they are documented in the
    design notes or source report.

    The API is storage-agnostic. It does not expose SQL, lakehouse zones,
    table names, partitions, or physical schema details.

servers:
  - url: /api/cqi/v1
    description: CQI API v1

security:
  - bearerAuth: []

tags:
  - name: Syringe Usage Summary
    description: Infusion-count summary for a selected population.
  - name: Syringe Usage Breakdown
    description: Infusion counts grouped by shared CQI dimensions.
  - name: Syringe Usage Trends
    description: Infusion counts over time.
  - name: Syringe Usage Infusions
    description: Infusion-level listing and detail using shared infusion identity fields.
  - name: Syringe Usage Exports
    description: Export syringe-usage report rows.

paths:

  /syringe-usage/summary-query:
    post:
      tags:
        - Syringe Usage Summary
      operationId: getSyringeUsageSummary
      summary: Get syringe usage summary
      description: |
        Returns the infusion count for a selected population.

        Report-specific syringe measures are not included in this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageSummaryRequest"
            examples:
              default:
                summary: Syringe usage summary request
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    drugLibraryVersionIds:
                      - "DLV-1002"
                    careAreaIds:
                      - "CA-ICU"
                    pumpTypes:
                      - "SYR"
      responses:
        "200":
          description: Syringe usage summary returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageSummaryResponse"
              examples:
                success:
                  value:
                    summary:
                      totalInfusions: 4820
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/breakdown-query:
    post:
      tags:
        - Syringe Usage Breakdown
      operationId: getSyringeUsageBreakdown
      summary: Get syringe usage breakdown
      description: |
        Returns infusion counts grouped by a shared CQI dimension already used
        by other Infusions Reporting APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageBreakdownRequest"
            examples:
              byCareArea:
                summary: Syringe usage breakdown by care area
                value:
                  groupBy: "CARE_AREA"
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                    drugLibraryVersionIds:
                      - "DLV-1002"
      responses:
        "200":
          description: Syringe usage breakdown returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageBreakdownResponse"
              examples:
                success:
                  value:
                    groupBy: "CARE_AREA"
                    items:
                      - id: "CA-ICU"
                        name: "ICU"
                        totalInfusions: 1800
                      - id: "CA-ER"
                        name: "Emergency"
                        totalInfusions: 950
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/trends-query:
    post:
      tags:
        - Syringe Usage Trends
      operationId: getSyringeUsageTrends
      summary: Get syringe usage trend
      description: Returns infusion counts over time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageTrendRequest"
            examples:
              daily:
                value:
                  granularity: "DAILY"
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
      responses:
        "200":
          description: Syringe usage trend returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageTrendResponse"
              examples:
                success:
                  value:
                    granularity: "DAILY"
                    points:
                      - periodStart: "2026-01-01T00:00:00Z"
                        periodEnd: "2026-01-01T23:59:59Z"
                        totalInfusions: 160
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/infusions-query:
    post:
      tags:
        - Syringe Usage Infusions
      operationId: searchSyringeUsageInfusions
      summary: Search syringe usage infusions
      description: |
        Returns infusion rows using the shared infusion identity fields already
        used by other Infusions Reporting APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageInfusionQueryRequest"
            examples:
              default:
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                  page:
                    pageNumber: 1
                    pageSize: 50
                  sort:
                    field: "startedAt"
                    direction: "DESC"
      responses:
        "200":
          description: Matching syringe usage infusions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageInfusionListResponse"
              examples:
                success:
                  value:
                    items:
                      - infusionId: "INF-123"
                        deviceSerialNumber: "SN001"
                        pumpType: "SYR"
                        careAreaName: "ICU"
                        drugName: "Heparin"
                        startedAt: "2026-01-02T10:35:00Z"
                    page:
                      pageNumber: 1
                      pageSize: 50
                      totalItems: 4820
                      hasMore: true
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/infusions/{infusionId}:
    get:
      tags:
        - Syringe Usage Infusions
      operationId: getSyringeUsageInfusion
      summary: Get syringe usage infusion detail
      parameters:
        - $ref: "#/components/parameters/InfusionId"
      responses:
        "200":
          description: Syringe usage infusion detail returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageInfusionDetailResponse"
              examples:
                success:
                  value:
                    infusion:
                      infusionId: "INF-123"
                      deviceId: "DEV-100"
                      deviceSerialNumber: "SN001"
                      pumpType: "SYR"
                      careAreaId: "CA-ICU"
                      careAreaName: "ICU"
                      drugId: "DRUG-HEPARIN"
                      drugName: "Heparin"
                      startedAt: "2026-01-02T10:35:00Z"
                      endedAt: "2026-01-02T14:10:00Z"
                    dataFreshness:
                      asOf: "2026-07-08T10:30:00Z"
                      watermark: "wm-20260708-103000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/exports:
    post:
      tags:
        - Syringe Usage Exports
      operationId: createSyringeUsageExport
      summary: Create syringe usage export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyringeUsageExportRequest"
            examples:
              csv:
                value:
                  filters:
                    dateRange:
                      from: "2026-01-01T00:00:00Z"
                      to: "2026-01-31T23:59:59Z"
                  exportFormat: "CSV"
                  columns:
                    - "infusionId"
                    - "deviceSerialNumber"
                    - "careAreaName"
                    - "drugName"
                    - "startedAt"
      responses:
        "202":
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageExportAcceptedResponse"
              examples:
                accepted:
                  value:
                    exportId: "EXP-SYR-1001"
                    status: "ACCEPTED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /syringe-usage/exports/{exportId}:
    get:
      tags:
        - Syringe Usage Exports
      operationId: getSyringeUsageExportStatus
      summary: Get syringe usage export status
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export status returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyringeUsageExportStatusResponse"
              examples:
                completed:
                  value:
                    exportId: "EXP-SYR-1001"
                    status: "COMPLETED"
                    fileName: "syringe-usage-export-202601.csv"
                    downloadUrl: "https://exports.cqi.example.com/EXP-SYR-1001.csv?sig=..."
                    expiresAt: "2026-07-08T11:31:20Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InfusionId:
      name: infusionId
      in: path
      required: true
      schema:
        type: string
      example: "INF-123"

    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
      example: "EXP-SYR-1001"

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Caller does not have access to the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    SyringeUsageSummaryRequest:
      type: object
      required:
        - filters
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeUsageBreakdownRequest:
      type: object
      required:
        - groupBy
        - filters
      properties:
        groupBy:
          $ref: "#/components/schemas/SyringeUsageGroupBy"
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeUsageTrendRequest:
      type: object
      required:
        - granularity
        - filters
      properties:
        granularity:
          $ref: "#/components/schemas/TrendGranularity"
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"

    SyringeUsageInfusionQueryRequest:
      type: object
      required:
        - filters
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"
        page:
          $ref: "#/components/schemas/PageRequest"
        sort:
          $ref: "#/components/schemas/SortRequest"

    SyringeUsageExportRequest:
      type: object
      required:
        - filters
        - exportFormat
      properties:
        filters:
          $ref: "#/components/schemas/SyringeUsageFilter"
        exportFormat:
          $ref: "#/components/schemas/ExportFormat"
        columns:
          type: array
          items:
            type: string
          example:
            - "infusionId"
            - "deviceSerialNumber"
            - "careAreaName"
            - "drugName"
            - "startedAt"

    SyringeUsageFilter:
      type: object
      description: |
        Shared CQI report filters already used by compliance, limits, and
        dose-rate-change APIs. No syringe-specific filters are defined yet.
      properties:
        dateRange:
          $ref: "#/components/schemas/DateRange"

        drugLibraryVersionIds:
          type: array
          items:
            type: string
          example:
            - "DLV-1002"

        careAreaIds:
          type: array
          items:
            type: string
          example:
            - "CA-ICU"

        drugIds:
          type: array
          items:
            type: string
          example:
            - "DRUG-HEPARIN"

        deviceIds:
          type: array
          items:
            type: string
          example:
            - "DEV-100"

        deviceSerialNumbers:
          type: array
          items:
            type: string
          example:
            - "SN001"

        pumpTypes:
          type: array
          items:
            type: string
          example:
            - "SYR"

        enterpriseHierarchyNodeIds:
          type: array
          items:
            type: string
          example:
            - "EH-100"

    DateRange:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        to:
          type: string
          format: date-time
          example: "2026-01-31T23:59:59Z"

    SyringeUsageSummaryResponse:
      type: object
      required:
        - summary
        - dataFreshness
      properties:
        summary:
          $ref: "#/components/schemas/SyringeUsageSummary"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageBreakdownResponse:
      type: object
      required:
        - groupBy
        - items
        - dataFreshness
      properties:
        groupBy:
          $ref: "#/components/schemas/SyringeUsageGroupBy"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageBreakdownItem"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageTrendResponse:
      type: object
      required:
        - granularity
        - points
        - dataFreshness
      properties:
        granularity:
          $ref: "#/components/schemas/TrendGranularity"
        points:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageTrendPoint"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageInfusionListResponse:
      type: object
      required:
        - items
        - page
        - dataFreshness
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyringeUsageInfusion"
        page:
          $ref: "#/components/schemas/PageMetadata"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageInfusionDetailResponse:
      type: object
      required:
        - infusion
        - dataFreshness
      properties:
        infusion:
          $ref: "#/components/schemas/SyringeUsageInfusion"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"

    SyringeUsageExportAcceptedResponse:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
          example: "EXP-SYR-1001"
        status:
          $ref: "#/components/schemas/ExportStatus"

    SyringeUsageExportStatusResponse:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
          example: "EXP-SYR-1001"
        status:
          $ref: "#/components/schemas/ExportStatus"
        fileName:
          type: string
          nullable: true
          example: "syringe-usage-export-202601.csv"
        downloadUrl:
          type: string
          nullable: true
          description: Secure temporary download URL, if export is ready.
        expiresAt:
          type: string
          format: date-time
          nullable: true

    SyringeUsageSummary:
      type: object
      required:
        - totalInfusions
      properties:
        totalInfusions:
          type: integer
          minimum: 0
          example: 4820
          description: Infusion count for the selected population.

    SyringeUsageBreakdownItem:
      type: object
      required:
        - id
        - name
        - totalInfusions
      properties:
        id:
          type: string
          example: "CA-ICU"
        name:
          type: string
          example: "ICU"
        totalInfusions:
          type: integer
          minimum: 0
          example: 1800

    SyringeUsageTrendPoint:
      type: object
      required:
        - periodStart
        - periodEnd
        - totalInfusions
      properties:
        periodStart:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        periodEnd:
          type: string
          format: date-time
          example: "2026-01-01T23:59:59Z"
        totalInfusions:
          type: integer
          minimum: 0
          example: 160

    SyringeUsageInfusion:
      type: object
      description: |
        Shared infusion identity fields used by other Infusions Reporting APIs.
        Syringe-specific attributes are not defined in this contract.
      required:
        - infusionId
        - startedAt
      properties:
        infusionId:
          type: string
          example: "INF-123"
        deviceId:
          type: string
          nullable: true
          example: "DEV-100"
        deviceSerialNumber:
          type: string
          nullable: true
          example: "SN001"
        pumpType:
          type: string
          nullable: true
          example: "SYR"
        drugLibraryVersionId:
          type: string
          nullable: true
          example: "DLV-1002"
        careAreaId:
          type: string
          nullable: true
          example: "CA-ICU"
        careAreaName:
          type: string
          nullable: true
          example: "ICU"
        drugId:
          type: string
          nullable: true
          example: "DRUG-HEPARIN"
        drugName:
          type: string
          nullable: true
          example: "Heparin"
        startedAt:
          type: string
          format: date-time
          example: "2026-01-02T10:35:00Z"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-02T14:10:00Z"

    DataFreshness:
      type: object
      required:
        - asOf
      properties:
        asOf:
          type: string
          format: date-time
          example: "2026-07-08T10:30:00Z"
        watermark:
          type: string
          nullable: true
          example: "wm-20260708-103000"

    PageRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          example: 50

    PageMetadata:
      type: object
      required:
        - pageNumber
        - pageSize
        - hasMore
      properties:
        pageNumber:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 50
        totalItems:
          type: integer
          nullable: true
          description: Optional. May be omitted when count is expensive.
          example: 1250
        hasMore:
          type: boolean
          example: true

    SortRequest:
      type: object
      properties:
        field:
          type: string
          example: "startedAt"
        direction:
          $ref: "#/components/schemas/SortDirection"

    SyringeUsageGroupBy:
      type: string
      description: Shared grouping dimensions from sibling Infusions Reporting APIs.
      enum:
        - DRUG_LIBRARY_VERSION
        - CARE_AREA
        - DRUG
        - PUMP_TYPE
        - DEVICE
        - ENTERPRISE_HIERARCHY

    TrendGranularity:
      type: string
      enum:
        - DAILY
        - WEEKLY
        - MONTHLY

    SortDirection:
      type: string
      enum:
        - ASC
        - DESC

    ExportFormat:
      type: string
      enum:
        - CSV
        - XLSX

    ExportStatus:
      type: string
      enum:
        - ACCEPTED
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - EXPIRED

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "CQI_SYRINGE_USAGE_INVALID_REQUEST"
        message:
          type: string
          example: "Invalid syringe usage query request."
        target:
          type: string
          nullable: true
          example: "filters.dateRange"
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        traceId:
          type: string
          nullable: true
          example: "0HN7ABC123XYZ"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_DATE_RANGE"
        message:
          type: string
          example: "The from date must be earlier than the to date."
        target:
          type: string
          nullable: true
          example: "filters.dateRange"
