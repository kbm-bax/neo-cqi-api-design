        periodEnd:
          type: string
          format: date-time
          example: "2026-01-01T23:59:59Z"
        totalSyringeInfusions:
          type: integer
          minimum: 0
          example: 160
        totalVolumeInfusedMl:
          type: number
          format: double
          minimum: 0
          example: 620.5
        syringeChangeCount:
          type: integer
          minimum: 0
          example: 12
        emptySyringeEventCount:
          type: integer
          minimum: 0
          example: 3
        averageSyringeUtilizationPercent:
          type: number
          format: double
          nullable: true
          example: 61.8

    SyringeSizeDistributionBucket:
      type: object
      required:
        - syringeSizeMl
        - infusionCount
      properties:
        syringeSizeMl:
          type: number
          format: double
          example: 10
        syringeBrand:
          type: string
          nullable: true
          example: "BD"
        infusionCount:
          type: integer
          minimum: 0
          example: 820
        totalVolumeInfusedMl:
          type: number
          format: double
          minimum: 0
          example: 4100.0
        averageUtilizationPercent:
          type: number
          format: double
          nullable: true
          example: 74.1

    SyringeUsageInfusion:
      type: object
      required:
        - syringeUsageInfusionId
        - infusionId
        - startedAt
      properties:
        syringeUsageInfusionId:
          type: string
          example: "SUI-10001"
        infusionId:
          type: string
          example: "INF-123"
        deviceId:
          type: string
          nullable: true
          example: "DEV-200"
        deviceSerialNumber:
          type: string
          nullable: true
          example: "SN-SYR-001"
        pumpType:
          type: string
          nullable: true
          example: "SYR"
        drugLibraryVersionId:
          type: string
          nullable: true
          example: "DLV-1002"
        careAreaId:
          type: string
          nullable: true
          example: "CA-NICU"
        careAreaName:
          type: string
          nullable: true
          example: "NICU"
        drugId:
          type: string
          nullable: true
          example: "DRUG-MORPHINE"
        drugName:
          type: string
          nullable: true
          example: "Morphine"
        syringeSizeMl:
          type: number
          format: double
          nullable: true
          example: 50
        syringeBrand:
          type: string
          nullable: true
          example: "BD"
        volumeInfusedMl:
          type: number
          format: double
          nullable: true
          example: 28.4
        syringeUtilizationPercent:
          type: number
          format: double
          nullable: true
          example: 56.8
        syringeChangeCount:
          type: integer
          minimum: 0
          example: 1
        startedAt:
          type: string
          format: date-time
          example: "2026-01-02T10:35:00Z"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-02T14:10:00Z"

    SyringeUsageInfusionDetail:
      allOf:
        - $ref: "#/components/schemas/SyringeUsageInfusion"
        - type: object
          properties:
            syringeModel:
              type: string
              nullable: true
              example: "Luer-Lok"
            programmedVolumeMl:
              type: number
              format: double
              nullable: true
              example: 30.0
            remainingVolumeMl:
              type: number
              format: double
              nullable: true
              example: 1.6
            emptySyringeEventCount:
              type: integer
              minimum: 0
              example: 0
            nearEmptyEventCount:
              type: integer
              minimum: 0
              example: 1
            concentration:
              $ref: "#/components/schemas/MeasuredValue"
            doseRate:
              $ref: "#/components/schemas/MeasuredValue"
            sourceEventReference:
              $ref: "#/components/schemas/SourceEventReference"
            canShowInfusionStory:
              type: boolean
              example: true
            infusionStoryAvailabilityReason:
              type: string
              nullable: true
              example: "Infusion story available."

    MeasuredValue:
      type: object
      properties:
        value:
          type: number
          format: double
          nullable: true
          example: 1.2
        unit:
          type: string
          nullable: true
          example: "mg/hr"

    SourceEventReference:
      type: object
      properties:
        sourceSystem:
          type: string
          nullable: true
          example: "PUMP_EVENT"
        sourceEventId:
          type: string
          nullable: true
          example: "PUMP-EVT-9001"
        eventCode:
          type: string
          nullable: true
          example: "SYRINGE_LOADED"

    DataFreshness:
      type: object
      required:
        - asOf
      properties:
        asOf:
          type: string
          format: date-time
          example: "2026-07-08T10:30:00Z"
        watermark:
          type: string
          nullable: true
          example: "wm-20260708-103000"

    PageRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          example: 50

    PageMetadata:
      type: object
      required:
        - pageNumber
        - pageSize
        - hasMore
      properties:
        pageNumber:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 50
        totalItems:
          type: integer
          nullable: true
          description: Optional. May be omitted when count is expensive.
          example: 1250
        hasMore:
          type: boolean
          example: true

    SortRequest:
      type: object
      properties:
        field:
          type: string
          example: "startedAt"
        direction:
          $ref: "#/components/schemas/SortDirection"

    SyringeUsageGroupBy:
      type: string
      enum:
        - SYRINGE_SIZE
        - SYRINGE_BRAND
        - DRUG_LIBRARY_VERSION
        - CARE_AREA
        - DRUG
        - PUMP_TYPE
        - DEVICE
        - ENTERPRISE_HIERARCHY

    TrendGranularity:
      type: string
      enum:
        - DAILY
        - WEEKLY
        - MONTHLY

    SortDirection:
      type: string
      enum:
        - ASC
        - DESC

    ExportFormat:
      type: string
      enum:
        - CSV
        - XLSX

    ExportStatus:
      type: string
      enum:
        - ACCEPTED
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - EXPIRED

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "CQI_SYRINGE_USAGE_INVALID_REQUEST"
        message:
          type: string
          example: "Invalid syringe usage query request."
        target:
          type: string
          nullable: true
          example: "filters.dateRange"
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        traceId:
          type: string
          nullable: true
          example: "0HN7ABC123XYZ"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_DATE_RANGE"
        message:
          type: string
          example: "The from date must be earlier than the to date."
        target:
          type: string
          nullable: true
          example: "filters.dateRange"
